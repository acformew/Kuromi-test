<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рабочие VPN-узлы</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{font-family:'Instrument Sans',system-ui,sans-serif;background:#10141c;color:#e6e9ef}
  .chip[aria-pressed=true]{background:#f0b44c;color:#10141c;border-color:#f0b44c}
  :focus-visible{outline:2px solid #f0b44c;outline-offset:2px}
  @keyframes spin{to{transform:rotate(360deg)}} .spin{animation:spin .8s linear infinite}
  @media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}
</style>
</head>
<body class="min-h-screen">
<main class="max-w-3xl mx-auto px-4 py-8">
  <header class="flex items-start gap-3">
    <div class="flex-1">
      <h1 class="text-3xl font-bold tracking-tight">Рабочие VPN-узлы</h1>
      <p id="status" class="text-slate-400 mt-1 text-sm">Загрузка…</p>
    </div>
    <button id="refresh" class="flex items-center gap-2 border border-slate-600 rounded-lg px-4 py-2 text-sm">
      <svg id="spin" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      Обновить список
    </button>
  </header>

  <section class="mt-6 space-y-3" aria-label="Фильтры">
    <input id="q" type="search" placeholder="Поиск: название, страна, флаг, адрес" class="w-full bg-[#1a202c] border border-slate-700 rounded-lg px-3 py-2 text-sm">
    <div id="regions" class="flex flex-wrap gap-2"></div>
    <div class="flex flex-wrap items-center gap-2">
      <select id="country" class="bg-[#1a202c] border border-slate-700 rounded-lg px-3 py-2 text-sm"></select>
      <select id="proto" class="bg-[#1a202c] border border-slate-700 rounded-lg px-3 py-2 text-sm">
        <option value="">Все протоколы</option><option value="vless">VLESS</option>
        <option value="vmess">VMess</option><option value="trojan">Trojan</option><option value="ss">Shadowsocks</option>
      </select>
      <label class="flex items-center gap-2 text-sm px-2"><input id="onlyAlive" type="checkbox" checked> Только рабочие</label>
    </div>
    <div class="flex flex-wrap gap-2">
      <button id="copyBest" class="bg-[#f0b44c] text-[#10141c] font-semibold rounded-lg px-4 py-2 text-sm">Скопировать лучший VLESS</button>
      <button id="copySub" class="border border-slate-600 rounded-lg px-4 py-2 text-sm">Скопировать ссылку подписки</button>
    </div>
  </section>

  <ul id="list" class="mt-6 divide-y divide-slate-800 border border-slate-800 rounded-xl overflow-hidden"></ul>
  <p class="text-xs text-slate-500 mt-6">Задержка измерена с сервера проверки через сам узел, поэтому у вас она будет другой. Публичные узлы могут видеть незашифрованный трафик.</p>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/70 items-center justify-center p-4" role="dialog" aria-modal="true">
  <div class="bg-white rounded-xl p-5 text-center">
    <div id="qr" class="mx-auto"></div>
    <button id="closeQr" class="mt-4 w-full bg-[#10141c] text-white rounded-lg py-2 text-sm">Закрыть</button>
  </div>
</div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-100 text-slate-900 rounded-lg px-4 py-2 text-sm hidden max-w-[90vw]"></div>

<script>
// Репозиторий определяется автоматически по адресу GitHub Pages. Для своего домена впишите "ник/репозиторий".
const REPO = '';
const m = location.hostname.match(/^(.+)\.github\.io$/);
const repo = REPO || (m ? `${m[1]}/${location.pathname.split('/')[1] || m[1] + '.github.io'}` : '');
const RAW = `https://raw.githubusercontent.com/${repo}/main`;
const REGION_LABEL = { '': 'Все', PL: 'Польша', EU: 'Европа', US: 'США', ASIA: 'Азия' };
const REGIONS = {
  EU: 'DE NL FR GB FI SE NO PL IT ES CH AT CZ RO BG LT LV EE IE DK BE PT HU UA'.split(' '),
  US: ['US', 'CA'], ASIA: 'JP SG HK KR TW IN AE TH VN ID MY TR KZ'.split(' '), PL: ['PL'],
};
const $ = (id) => document.getElementById(id);
const names = new Intl.DisplayNames(['ru'], { type: 'region' });
const emoji = (c) => c && c.length === 2 ? String.fromCodePoint(...[...c].map((x) => x.charCodeAt(0) + 0x1f1e6 - 65)) : '🌐';
const cname = (c) => { try { return names.of(c) || c; } catch { return c; } };
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pingCls = (ms) => ms == null ? 'text-slate-400 bg-slate-800' : ms < 150 ? 'text-emerald-300 bg-emerald-950' : ms <= 350 ? 'text-amber-300 bg-amber-950' : 'text-red-300 bg-red-950';
let nodes = [], region = '', shown = [];

function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hidden'), 2200); }
async function copy(t, msg) { try { await navigator.clipboard.writeText(t); toast(msg); } catch { prompt('Скопируйте вручную:', t); } }
const ago = (iso) => { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 60 ? `${m} мин назад` : `${Math.round(m / 60)} ч назад`; };

async function load() {
  if (!repo) { $('status').textContent = 'Не удалось определить репозиторий. Впишите его в константу REPO.'; return; }
  $('spin').classList.add('spin'); $('refresh').disabled = true;
  try {
    const r = await fetch(`${RAW}/data/nodes.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    nodes = d.nodes;
    const alive = nodes.filter((x) => x.ms != null).length;
    $('status').innerHTML = `Рабочих: ${alive} из ${d.tested} проверенных. Проверка была ${ago(d.updated)}. ` +
      `<a class="underline" target="_blank" rel="noopener" href="https://github.com/${repo}/actions/workflows/check.yml">Запустить проверку заново</a>`;
    const codes = [...new Set(nodes.map((x) => x.c).filter(Boolean))].sort();
    const cur = $('country').value;
    $('country').innerHTML = '<option value="">Все страны</option>' + codes.map((c) => `<option value="${c}">${emoji(c)} ${cname(c)}</option>`).join('');
    $('country').value = codes.includes(cur) ? cur : '';
    render();
  } catch {
    $('status').textContent = 'Данных пока нет. Откройте Actions в репозитории и запустите проверку (Run workflow).';
  } finally { $('spin').classList.remove('spin'); $('refresh').disabled = false; }
}

function render() {
  const c = $('country').value, p = $('proto').value, q = $('q').value.trim().toLowerCase(), only = $('onlyAlive').checked;
  shown = nodes.filter((x) =>
    (!only || x.ms != null) && (!c || x.c === c) && (!p || x.p === p) && (!region || REGIONS[region].includes(x.c)) &&
    (!q || `${x.n} ${x.h} ${x.c} ${cname(x.c)} ${emoji(x.c)}`.toLowerCase().includes(q)))
    .sort((a, b) => (a.ms ?? 1e9) - (b.ms ?? 1e9));
  const ul = $('list');
  if (!shown.length) { ul.innerHTML = '<li class="p-6 text-slate-400 text-sm">Нет узлов по этим фильтрам. Смените регион, протокол или поиск.</li>'; return; }
  ul.innerHTML = shown.slice(0, 200).map((x, i) => `
    <li data-i="${i}" class="flex items-center gap-3 px-4 py-3 bg-[#151b26] cursor-pointer hover:bg-[#1a2230]">
      <span class="text-xl" aria-hidden="true">${emoji(x.c)}</span>
      <div class="min-w-0 flex-1"><div class="truncate text-sm font-semibold">${esc(x.n || x.h)}</div>
        <div class="text-xs text-slate-400 uppercase">${x.p}${x.c ? ' ' + x.c : ''}</div></div>
      <span class="text-xs font-semibold rounded-md px-2 py-1 ${pingCls(x.ms)}">${x.ms == null ? 'N/A' : '⚡ ' + x.ms + ' ms'}</span>
      <button data-copy="${i}" class="border border-slate-600 rounded-md px-3 py-1.5 text-xs">Копировать</button>
    </li>`).join('');
}

$('list').addEventListener('click', (e) => {
  const li = e.target.closest('li[data-i]'); if (!li) return;
  const x = shown[+li.dataset.i];
  if (e.target.closest('[data-copy]')) return copy(x.l, 'Ключ скопирован');
  $('qr').innerHTML = '';
  new QRCode($('qr'), { text: x.l, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.L });
  $('modal').classList.replace('hidden', 'flex');
});
$('closeQr').onclick = () => $('modal').classList.replace('flex', 'hidden');
$('modal').onclick = (e) => { if (e.target === $('modal')) $('closeQr').click(); };
['country', 'proto', 'onlyAlive'].forEach((id) => $(id).onchange = render);
$('q').oninput = render;
$('refresh').onclick = load;

$('copyBest').onclick = () => {
  const best = nodes.filter((x) => x.ms != null && x.p === 'vless').sort((a, b) => a.ms - b.ms)[0];
  best ? copy(best.l, `Скопирован самый быстрый VLESS (${best.ms} ms)`) : toast('Рабочих VLESS-узлов нет');
};
$('copySub').onclick = () => {
  const c = $('country').value, p = $('proto').value;
  const file = c || region || p || 'all';
  const alive = nodes.filter((x) => x.ms != null && (!c || x.c === c) && (!region || REGIONS[region].includes(x.c)) && (!p || x.p === p));
  if (!alive.length) return toast('Для этого фильтра нет рабочих узлов');
  copy(`${RAW}/sub/${file}.txt`, `Ссылка подписки скопирована (${file})`);
};

$('regions').innerHTML = Object.entries(REGION_LABEL).map(([k, v]) =>
  `<button class="chip border border-slate-600 rounded-full px-4 py-1.5 text-sm" data-r="${k}" aria-pressed="${k === ''}">${v}</button>`).join('');
$('regions').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  region = b.dataset.r;
  $('regions').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
  render();
};
load();
</script>
</body>
</html>
