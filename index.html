<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бесплатные VPN-ключи</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body{font-family:'Instrument Sans',system-ui,sans-serif;background:#10141c;color:#e6e9ef}
  .chip[aria-pressed=true]{background:#f0b44c;color:#10141c;border-color:#f0b44c}
  select,button{outline-offset:2px} :focus-visible{outline:2px solid #f0b44c}
</style>
</head>
<body class="min-h-screen">
<main class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold tracking-tight">Свободные VPN-ключи</h1>
  <p id="status" class="text-slate-400 mt-1 text-sm">Загрузка…</p>

  <section class="mt-6 space-y-3" aria-label="Фильтры">
    <div id="regions" class="flex flex-wrap gap-2"></div>
    <div class="flex flex-wrap gap-2">
      <select id="country" class="bg-[#1a202c] border border-slate-700 rounded-lg px-3 py-2 text-sm"></select>
      <select id="proto" class="bg-[#1a202c] border border-slate-700 rounded-lg px-3 py-2 text-sm">
        <option value="">Все протоколы</option><option value="vless">VLESS</option>
        <option value="vmess">VMess</option><option value="trojan">Trojan</option><option value="ss">Shadowsocks</option>
      </select>
      <button id="copySub" class="ml-auto bg-[#f0b44c] text-[#10141c] font-semibold rounded-lg px-4 py-2 text-sm">Скопировать ссылку подписки</button>
      <button id="copyAll" class="border border-slate-600 rounded-lg px-4 py-2 text-sm">Скопировать все ключи</button>
    </div>
  </section>

  <ul id="list" class="mt-6 divide-y divide-slate-800 border border-slate-800 rounded-xl overflow-hidden"></ul>
  <p class="text-xs text-slate-500 mt-6">Ключи собраны из публичных источников. Публичные узлы могут видеть ваш трафик: не вводите через них пароли и платёжные данные без HTTPS.</p>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/70 items-center justify-center p-4" role="dialog" aria-modal="true">
  <div class="bg-white rounded-xl p-5 text-center">
    <div id="qr" class="mx-auto"></div>
    <button id="closeQr" class="mt-4 w-full bg-[#10141c] text-white rounded-lg py-2 text-sm">Закрыть</button>
  </div>
</div>
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-100 text-slate-900 rounded-lg px-4 py-2 text-sm hidden"></div>

<script>
// После деплоя Cloudflare Worker вставьте сюда его адрес. Пока адрес не задан, сайт работает без бэкенда (режим Б).
const WORKER_URL = 'https://YOUR-WORKER.workers.dev';
const SOURCES = [
  'https://raw.githubusercontent.com/barry-far/V2ray-Config/main/All_Configs_Sub.txt',
  'https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt',
  'https://raw.githubusercontent.com/MatinGhanbari/v2ray-CONFIGs/main/subscriptions/v2ray/super-sub.txt',
  'https://raw.githubusercontent.com/mahdibland/V2RayAggregator/master/sub/sub_merge.txt',
];
const REGIONS = {
  EU: 'DE NL FR GB FI SE NO PL IT ES CH AT CZ RO BG LT LV EE IE DK BE PT HU UA'.split(' '),
  US: ['US', 'CA'], ASIA: 'JP SG HK KR TW IN AE TH VN ID MY TR KZ'.split(' '),
};
const REGION_LABEL = { '': 'Все', PL: 'Польша', EU: 'Европа', US: 'США', ASIA: 'Азия' };
const useWorker = !WORKER_URL.includes('YOUR-');
const $ = (id) => document.getElementById(id);
const names = new Intl.DisplayNames(['ru'], { type: 'region' });
let nodes = [], region = '';

const b64d = (s) => { try { s = s.trim().replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '=';
  return new TextDecoder().decode(Uint8Array.from(atob(s), (c) => c.charCodeAt(0))); } catch { return ''; } };
const flag = (t) => { const m = (t || '').match(/[\u{1F1E6}-\u{1F1FF}]{2}/u);
  return m ? [...m[0]].map((c) => String.fromCharCode(c.codePointAt(0) - 0x1f1e6 + 65)).join('') : ''; };
const emoji = (c) => c.length === 2 ? String.fromCodePoint(...[...c].map((x) => x.charCodeAt(0) + 0x1f1e6 - 65)) : '🌐';

function parse(link) {
  link = link.trim();
  const p = (link.match(/^(vless|vmess|trojan|ss):\/\//) || [])[1];
  if (!p) return null;
  try {
    let h, o, n = '';
    if (p === 'vmess') { const j = JSON.parse(b64d(link.slice(8))); h = j.add; o = +j.port; n = j.ps || ''; }
    else {
      const i = link.indexOf('#'); if (i > -1) n = decodeURIComponent(link.slice(i + 1));
      let b = link.slice(p.length + 3, i > -1 ? i : undefined).split('?')[0];
      if (p === 'ss' && !b.includes('@')) b = b64d(b);
      const hp = b.slice(b.lastIndexOf('@') + 1), k = hp.lastIndexOf(':');
      h = hp.slice(0, k); o = +hp.slice(k + 1).replace(/\W.*/, '');
    }
    return h && o ? { p, h, o, n: n.slice(0, 80), c: flag(n), l: link } : null;
  } catch { return null; }
}

async function loadDirect() {
  const res = await Promise.allSettled(SOURCES.map(async (u) => {
    const t = await (await fetch(u)).text(); return t.includes('://') ? t : b64d(t); }));
  const seen = new Set(), out = [];
  res.forEach((r) => r.status === 'fulfilled' && r.value.split(/\r?\n/).forEach((l) => {
    const n = parse(l); if (n && !seen.has(n.l)) { seen.add(n.l); out.push(n); } }));
  return { nodes: out.sort(() => Math.random() - 0.5).slice(0, 400), updated: new Date().toISOString() };
}

async function load() {
  let data;
  if (useWorker) { try { data = await (await fetch(WORKER_URL + '/api/nodes')).json(); } catch {} }
  if (!data || !data.nodes.length) data = await loadDirect(); // резерв: источники напрямую
  nodes = data.nodes;
  const mode = useWorker && data.nodes[0] && 'ms' in data.nodes[0] ? 'проверены на доступность' : 'без проверки доступности';
  $('status').textContent = nodes.length ? `${nodes.length} ключей, ${mode}. Обновлено ${new Date(data.updated).toLocaleString('ru')}` : 'Не удалось получить ключи. Попробуйте позже.';
  const codes = [...new Set(nodes.map((x) => x.c).filter(Boolean))].sort();
  $('country').innerHTML = '<option value="">Все страны</option>' + codes.map((c) => `<option value="${c}">${emoji(c)} ${names.of(c) || c}</option>`).join('');
  render();
}

function filtered() {
  const c = $('country').value, p = $('proto').value;
  return nodes.filter((x) => (!c || x.c === c) && (!p || x.p === p) && (!region || (REGIONS[region] || [region]).includes(x.c)));
}

function render() {
  const list = filtered(), ul = $('list');
  ul.innerHTML = '';
  if (!list.length) { ul.innerHTML = '<li class="p-6 text-slate-400 text-sm">Нет ключей по этим фильтрам. Выберите другой регион или протокол.</li>'; return; }
  list.slice(0, 150).forEach((x, i) => {
    const li = document.createElement('li');
    li.className = 'flex items-center gap-3 px-4 py-3 bg-[#151b26]';
    const dot = 'ms' in x ? (x.ms < 400 ? 'bg-emerald-400' : 'bg-amber-400') : 'bg-slate-600';
    li.innerHTML = `<span class="text-xl" aria-hidden="true">${emoji(x.c)}</span>
      <div class="min-w-0 flex-1"><div class="truncate text-sm font-semibold">${esc(x.n || x.h)}</div>
      <div class="text-xs text-slate-400 flex items-center gap-2"><span class="uppercase">${x.p}</span>
      <span class="inline-block w-2 h-2 rounded-full ${dot}"></span>${'ms' in x ? x.ms + ' мс' : 'не проверен'}</div></div>
      <button data-a="copy" data-i="${i}" class="border border-slate-600 rounded-md px-3 py-1.5 text-xs">Копировать</button>
      <button data-a="qr" data-i="${i}" class="border border-slate-600 rounded-md px-3 py-1.5 text-xs">QR</button>`;
    ul.appendChild(li);
  });
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function toast(t) { const e = $('toast'); e.textContent = t; e.classList.remove('hidden'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.add('hidden'), 1800); }
async function copy(t, msg) { try { await navigator.clipboard.writeText(t); toast(msg); } catch { prompt('Скопируйте вручную:', t); } }

$('list').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const x = filtered()[+b.dataset.i];
  if (b.dataset.a === 'copy') copy(x.l, 'Ключ скопирован');
  else { $('qr').innerHTML = ''; new QRCode($('qr'), { text: x.l, width: 260, height: 260, correctLevel: QRCode.CorrectLevel.L });
    $('modal').classList.replace('hidden', 'flex'); }
});
$('closeQr').onclick = () => $('modal').classList.replace('flex', 'hidden');
$('modal').onclick = (e) => { if (e.target === $('modal')) $('closeQr').click(); };
$('country').onchange = $('proto').onchange = render;
$('copyAll').onclick = () => copy(filtered().map((x) => x.l).join('\n'), 'Ключи скопированы');
$('copySub').onclick = () => {
  if (!useWorker) { const raw = filtered().map((x) => x.l).join('\n');
    return copy(btoa(unescape(encodeURIComponent(raw))), 'Ссылка подписки доступна после деплоя Worker. Скопирован Base64-список'); }
  const q = new URLSearchParams(); if (region) q.set('r', region);
  if ($('country').value) q.set('c', $('country').value); if ($('proto').value) q.set('p', $('proto').value);
  copy(`${WORKER_URL}/sub?${q}`, 'Ссылка подписки скопирована');
};

$('regions').innerHTML = Object.entries(REGION_LABEL).map(([k, v]) =>
  `<button class="chip border border-slate-600 rounded-full px-4 py-1.5 text-sm" data-r="${k}" aria-pressed="${k === ''}">${v}</button>`).join('');
$('regions').onclick = (e) => { const b = e.target.closest('button'); if (!b) return; region = b.dataset.r;
  $('regions').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); render(); };

load();
</script>
</body>
</html>
